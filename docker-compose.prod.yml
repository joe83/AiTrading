version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Database: TimescaleDB (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: aitrading-db
    restart: always
    env_file:
      - ./server/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitrading_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aitrading}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitrading}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # 2. Redis: High-speed in-memory cache & PubSub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aitrading-redis
    restart: always
    env_file:
      - ./server/.env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_trading_pass}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_trading_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # 3. Server: Rust Backend (REST API + WebSocket + Grok AI + Exchange Connectors)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aitrading-server
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_WS_PORT: "8081"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-aitrading}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aitrading}"
    volumes:
      - ./server/.env:/app/.env
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - internal-net
      - public-net

  # ----------------------------------------------------------------------------
  # 4. Web: React 19 + TypeScript Web Dashboard (Static files)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: aitrading-web
    restart: always
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # 5. Gateway: Nginx Reverse Proxy (Rate-Limiting, WebSockets, SPA)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: aitrading-nginx
    restart: always
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - server
      - web
    networks:
      - internal-net
      - public-net

volumes:
  pgdata:
    driver: local

networks:
  internal-net:
    internal: true
  public-net:
    driver: bridge
