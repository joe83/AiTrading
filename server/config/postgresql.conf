# ============================================================================
# PostgreSQL + TimescaleDB — Optimized for AI Trading Workloads
# ============================================================================
# Tuned for: high-throughput candle writes, fast time-range queries,
# compression, and continuous aggregates on a small-fund server (2-4GB RAM).

# ---------------------------------------------------------------------------
# Connection Settings
# ---------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 50
superuser_reserved_connections = 3

# ---------------------------------------------------------------------------
# Memory — Tuned for 2GB RAM container
# ---------------------------------------------------------------------------
# 25% of available RAM for shared buffers
shared_buffers = 512MB

# Per-query working memory (sorts, hash joins, etc.)
# Trading queries are typically simple, so 64MB is plenty
work_mem = 64MB

# Memory for maintenance operations (VACUUM, CREATE INDEX, compression)
maintenance_work_mem = 256MB

# Effective cache size — tell planner about OS cache (75% of RAM)
effective_cache_size = 1536MB

# ---------------------------------------------------------------------------
# WAL (Write-Ahead Log) — Optimized for write-heavy candle ingestion
# ---------------------------------------------------------------------------
# Larger WAL buffers for batch candle writes
wal_buffers = 32MB

# Minimal WAL level (no replication needed for single-server)
wal_level = minimal
max_wal_senders = 0

# Checkpoint tuning — less frequent = better write throughput
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB

# Reduce fsync frequency for better performance (acceptable for trading data
# that can be re-fetched from exchanges)
synchronous_commit = off
commit_delay = 100

# ---------------------------------------------------------------------------
# Query Planner — Optimized for time-series access patterns
# ---------------------------------------------------------------------------
# Prefer index scans on time-ordered data
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# Enable parallel query for aggregate queries (SUM, AVG on candles)
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 8
parallel_tuple_cost = 0.01
parallel_setup_cost = 100

# ---------------------------------------------------------------------------
# Background Workers — For TimescaleDB jobs (compression, aggregates)
# ---------------------------------------------------------------------------
# TimescaleDB needs background workers for:
# - Compression policies
# - Continuous aggregate refresh
# - Retention policies
timescaledb.max_background_workers = 4

# ---------------------------------------------------------------------------
# Autovacuum — Tuned for high-write candle table
# ---------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
# More aggressive vacuum for the candles table (many inserts)
autovacuum_vacuum_threshold = 1000
autovacuum_analyze_threshold = 500
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ---------------------------------------------------------------------------
# Logging — Essential for debugging trading issues
# ---------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Log slow queries (>500ms) for optimization
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on

# Don't log every statement (too verbose for trading)
log_statement = 'ddl'

# ---------------------------------------------------------------------------
# TimescaleDB Specific
# ---------------------------------------------------------------------------
# Preload TimescaleDB
shared_preload_libraries = 'timescaledb'

# Telemetry off (privacy)
timescaledb.telemetry_level = off
