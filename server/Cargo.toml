[package]
name = "ai-trading-server"
version = "0.1.0"
edition = "2021"
description = "AI-powered multi-market trading platform server"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Web framework & API
axum = { version = "0.7", features = ["ws", "json"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# HTTP client (Grok API, exchange REST APIs)
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "rust_decimal"] }

# Technical Analysis
ta = "0.5"

# Cryptographic signing (exchange API auth)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Authentication (JWT for mobile app)
jsonwebtoken = "9"

# Time & dates
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Decimal precision for financial calculations
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Environment variables
dotenvy = "0.15"

# URL encoding for API queries
urlencoding = "2"

# Async trait support
async-trait = "0.1"

# Rate limiting
governor = "0.6"

# Statistics (for custom indicators)
statrs = "0.17"

# CSV parsing (for backtest data import)
csv = "1.3"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
